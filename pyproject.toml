[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-opinion"
version = "0.1.0"
description = "The Second Opinion — a multi-agent equity research crew that produces cited one-page due-diligence reports."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
second-opinion = "second_opinion.__main__:main"

[project.optional-dependencies]
# Dense-vector RAG (ChromaDB + MiniLM). Without it the pipeline uses the built-in TF-IDF retriever automatically.
rag = ["chromadb>=0.5", "sentence-transformers>=3.0"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
